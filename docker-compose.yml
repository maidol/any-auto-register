services:
  app:
    build: .
    ports:
      - "8000:8000"   # FastAPI / Web UI
      - "6080:6080"   # noVNC (headed 浏览器预览)
      - "8889:8889"   # Turnstile Solver
    environment:
      - DISPLAY=:99
      - ACCOUNT_MANAGER_DATABASE_URL=sqlite:////app/data/account_manager.db
      - MIHOMO_BIN=/usr/local/bin/mihomo
      - MIHOMO_START_TIMEOUT=20
      - MIHOMO_HEALTHCHECK_TIMEOUT=20
      - MIHOMO_HEALTHCHECK_URL=https://www.gstatic.com/generate_204
      # OpenVPN 每轮最多检查的候选节点；设为 0 表示不限制
      - MIHOMO_MAX_CANDIDATES=5
      - VPN_GATE_REFRESH_ENABLED=true
      - VPN_GATE_REFRESH_TIME=00:00
      - VPN_GATE_REFRESH_TIMEZONE=Asia/Shanghai
      - VPN_GATE_REFRESH_RETRIES=3
      # 可选：设置访问密码，不设置则无密码保护
      # - APP_PASSWORD=changeme
      # 可选：设置 VNC 密码
      # - VNC_PASSWORD=changeme
    volumes:
      - ./data:/app/data   # 持久化 SQLite 数据库
    restart: unless-stopped
